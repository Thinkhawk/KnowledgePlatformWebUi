<span class="back-link" (click)="cancel()">← Back to Team</span>

<h4>Edit Team</h4>
<hr />

<div *ngIf="concurrencyError" class="alert alert-warning">
  This record was updated by someone else. Please refresh and try again.
</div>

<form [formGroup]="form" (ngSubmit)="update()" class="form-sheet">

  <div class="mb-3">
    <label class="form-label">Team Name *</label>
    <input class="form-control"
           formControlName="name"
           placeholder="Enter Team Name" />
    <div *ngIf="form.get('name')?.touched && form.get('name')?.hasError('required')"
         class="text-danger small">Team name is required.</div>
    <div *ngIf="form.get('name')?.hasError('minlength')"
         class="text-danger small">Minimum 2 characters.</div>
    <div *ngIf="form.get('name')?.hasError('maxlength')"
         class="text-danger small">Maximum 100 characters.</div>
    <div *ngIf="serverErrors['Name']" class="text-danger small">
      {{ serverErrors['Name'][0] }}
    </div>
  </div>

  <div class="d-flex gap-2">
      <button type="button" class="btn btn-outline-secondary" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn-theme" [disabled]="form.invalid">Update Team</button>
  </div>

</form>
