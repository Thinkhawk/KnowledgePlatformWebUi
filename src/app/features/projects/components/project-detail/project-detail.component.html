<span class="back-link" (click)="router.navigate(['/projects'])">← Back to Projects</span>

<div *ngIf="project" class="mt-3">

  <div class="d-flex justify-content-between align-items-start mb-3">
    <div>
      <h4><app-icon name="project" [size]="22" class="me-2"></app-icon>{{ project.name }}</h4>
      <p class="text-muted">{{ project.description || 'No description' }}</p>
      <small class="text-muted">Created: {{ project.createdAtUtc | date:'mediumDate' }}</small>
    </div>
    <div class="d-flex gap-2">
      <button *ngIf="canEditProject" class="btn-theme-outline" (click)="editProject()"><i class="bi bi-pencil-square me-0"></i></button>
      <button *ngIf="canDeleteProject" class="btn-theme-danger-outline" (click)="confirmDelete()"> <i class="bi bi-trash3 me-0"></i></button>
    </div>
  </div>

  <hr />

  <div class="page-header">
    <h5>Teams</h5>
    <button *ngIf="isLead"
            class="btn-theme"
            (click)="createTeam()">
      + Create Team
    </button>
  </div>

  <div class="card-grid">
    <div *ngFor="let team of teams" class="card-item">
      <div>
        <h6><app-icon name="team" [size]="16" class="me-1"></app-icon>{{ team.name }}</h6>
      </div>
      <div class="mt-2">
        <button class="btn-theme-outline" (click)="openTeam(team)">
          {{ isLead ? 'Manage →' : 'Open →' }}
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="teams.length === 0" class="text-muted mt-3">
    No teams found for this project.
  </div>

</div>

<app-confirm-modal #deleteModal
  title="Delete Project"
  message="Deleting this project will also delete all its teams and their data. Are you sure?"
  confirmText="Delete"
  confirmClass="btn-theme-danger"
  (confirmed)="onDeleteConfirmed()">
</app-confirm-modal>
