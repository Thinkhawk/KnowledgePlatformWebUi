<div class="page-header">
  <h4>My Projects</h4>
  <button *ngIf="canCreateProject"
          class="btn-theme"
          (click)="router.navigate(['/projects/create'])">
    + Create Project
  </button>
</div>

<div class="card-grid">
  <div *ngFor="let project of projects"
       class="card-item"
       (click)="openProject(project)">
    <div>
      <h5 class="mb-1"><app-icon name="project" [size]="18" class="me-1"></app-icon>{{ project.projectName }}</h5>
      <p class="text-muted small mb-2">{{ project.description || 'No description' }}</p>
    </div>
    <div class="mt-3">
      <button class="btn-theme-outline" (click)="openProject(project)">Open →</button>
    </div>
  </div>
</div>

<div *ngIf="projects.length === 0" class="text-muted mt-4">
  No projects assigned to you.
</div>
