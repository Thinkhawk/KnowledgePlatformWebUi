<div class="page-container">

  <div class="page-header">
    <h2>Create User</h2>
    <hr />
  </div>

  <div class="form-card">

    <div *ngIf="successMessage" class="alert-success">
      &#10003; {{ successMessage }}
    </div>

    <div *ngIf="errorMessage" class="alert-error">
      &#10007; {{ errorMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="form-group">
        <label class="form-label">Username <span class="required">*</span></label>
        <input formControlName="username" type="text" class="form-control" placeholder="e.g. nidhi_test" />
        <div *ngIf="form.get('username')?.invalid && form.get('username')?.touched" class="field-error">
          Username is required (2–50 characters).
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Full Name <span class="required">*</span></label>
        <input formControlName="fullName" type="text" class="form-control" placeholder="e.g. Nidhi priya" />
        <div *ngIf="form.get('fullName')?.invalid && form.get('fullName')?.touched" class="field-error">
          Full name is required (2–100 characters).
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email <span class="required">*</span></label>
        <input formControlName="email" type="email" class="form-control" placeholder="e.g. nidhi@example.com" />
        <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="field-error">
          A valid email address is required.
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password <span class="required">*</span></label>
        <input formControlName="password" type="password" class="form-control" placeholder="Min. 6 characters" />
        <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="field-error">
          Password must be at least 6 characters.
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Role <span class="required">*</span></label>
        <select formControlName="role" class="form-control">
          <option value="ProjectLead">Project Lead</option>
          <option value="TeamMember">Team Member</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-theme-outline" (click)="cancel()">Cancel</button>
        <button type="submit" class="btn-theme" [disabled]="form.invalid || submitting">
          {{ submitting ? 'Creating...' : 'Create User' }}
        </button>
      </div>

    </form>
  </div>

</div>
