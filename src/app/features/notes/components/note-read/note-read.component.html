<div class="container mt-1">
    <div *ngIf="apiError()" class="alert alert-danger">
        {{ apiError() }}
    </div>

    <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-warning shadow-sm"
                [disabled]="!hasCreateAccess()"
                [routerLink]="['createNote']">
            Create Note
        </button>
    </div>

    <note-filter [teamId]="teamId()"
                 [noteReadModels]="noteReadModels()"
                 (filterEvent)="handleFilterEvent($event)">
    </note-filter>

    <div class="mt-4">
        <div class="row">
            <div class="col-lg-3 col-md-4 col-sm-6 mb-4" *ngFor="let note of noteReadModels()">
                <div class="card h-100 shadow-sm border-0 note-card">
                    <a [routerLink]="['view', note.noteId]" class="text-decoration-none text-dark d-flex flex-column h-100">
                        <div class="card-body">
                            <h6 class="card-title fw-bold text-truncate mb-1">{{ note.title }}</h6>

                            <small class="text-muted d-block mb-2">By: {{ note.creatorName }}</small>

                            <p class="card-text small text-secondary line-clamp-2">
                                {{ note.content }}
                            </p>

                            <div class="mt-auto pt-2">
                                <span class="badge rounded-pill bg-light text-dark border me-1"
                                      *ngFor="let tag of note.tags | slice:0:5">
                                    #{{ tag }}
                                </span>
                            </div>
                        </div>
                    </a>

                    @if(hasEditDeleteAccess(note.creatorId == authService.getPayload()?.unique_name)){
                    <div class="card-footer bg-transparent border-top-0">
                        <div class="d-flex justify-content-evenly">
                            <a class="btn btn-sm btn-outline-primary px-4 py-1 fw-bold shadow-sm" [routerLink]="['edit/', note.noteId]">Edit</a>
                            <a class="btn btn-sm btn-outline-danger px-4 py-1 fw-bold shadow-sm" [routerLink]="['delete/', note.noteId]">Delete</a>
                        </div>
                    </div>
                    }
                </div>
            </div>
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
