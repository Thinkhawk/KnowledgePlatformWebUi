<div class="page-container mx-auto">
    <div *ngIf="apiError()" class="alert-error mb-3">
        {{ apiError() }}
    </div>

    <div class="page-header mb-4">
        <div>
            <h6 class="title mb-1 ms-0">Knowledge Notes</h6>
        </div>
        <div class="d-flex gap-2">
            <button class="btn-theme-outline" (click)="toggleFilter()">
                <i class="bi" [ngClass]="showFilter ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
                 Filters
            </button>
            <button class="btn-theme" [disabled]="!hasCreateAccess()" [routerLink]="['createNote']">
                <i class="bi bi-plus-lg me-1"></i> Create Note
            </button>
        </div>
    </div>

    <note-filter *ngIf="showFilter" [teamId]="teamId()" [noteReadModels]="noteReadModels()" (filterEvent)="handleFilterEvent($event)">
    </note-filter>

    <div class="mt-4">
        <div class="card-grid">
            <div class="note-card h-100" *ngFor="let note of noteReadModels()">

                <div class="note-actions" *ngIf="hasEditDeleteAccess(note.creatorId == authService.getPayload()?.unique_name)">
                    <a class="action-btn edit" [routerLink]="['edit/', note.noteId]" title="Edit Note">
                        <i class="bi bi-pencil-square"></i>
                    </a>
                    <a class="action-btn delete" [routerLink]="['delete/', note.noteId]" title="Delete Note">
                        <i class="bi bi-trash3"></i>
                    </a>
                </div>

                <a [routerLink]="['view', note.noteId]" class="text-decoration-none text-dark d-flex flex-column h-100">
                    <div class="card-body p-4">
                        <h6 class="card-title fw-bold text-truncate pe-5 mb-1" [title]="note.title">
                            {{ note.title }}
                        </h6>
                        <small class="text-muted d-block mb-3">By: {{ note.creatorName }}</small>

                        <p class="card-text small text-secondary line-clamp-2 mb-4">
                            {{ note.content }}
                        </p>

                        <div class="mt-auto pt-2">
                            <span class="badge rounded-pill bg-light text-dark border me-1 x-small" *ngFor="let tag of note.tags | slice:0:5">
                                #{{ tag }}
                            </span>
                        </div>
                    </div>
                </a>
            </div>
        </div>
        <router-outlet></router-outlet>
    </div>
</div>
