<div class="delete-overlay">
    <div class="delete-card text-center">

        @if (apiError() || concurrencyError()) {
        <div class="alert alert-danger p-2 small mb-3 text-start">
            <i class="bi bi-exclamation-circle me-1"></i>
            {{ apiError() || concurrencyError() }}
            @if (concurrencyError()) {
            <button class="btn btn-xs btn-link p-0 ms-1 fw-bold" (click)="loadNotes()">
                Reload Note
            </button>
            }
        </div>
        }

        <div class="mb-4">
            <div class="text-danger mb-2">
                <i class="bi bi-trash3 fs-1"></i>
            </div>
            <h5 class="fw-bold">Delete Note?</h5>
            <p class="text-muted small px-2">
                This action is permanent and cannot be undone. Are you sure you want to proceed?
            </p>
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-danger w-100 py-2 fw-semibold"
                    (click)="confirmDelete()"
                    [disabled]="concurrencyError() !== null">
                Yes, Delete
            </button>
            <a (click)="onCancel()"
               class="btn btn-light border w-100 py-2 fw-semibold">
                Cancel
            </a>
        </div>
    </div>
</div>
