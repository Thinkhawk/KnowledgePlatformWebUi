<div class="kp-card mx-auto" style="max-width:900px; margin-top:24px;">
  <div class="kp-header d-flex justify-content-between align-items-center">
    <div>
      <h2 class="mb-0">Users</h2>
      <p class="text-muted small mb-0">Project Admins, Project Leads and Team Members (ProjectAdmin only)</p>
    </div>
    <div>
      <button class="btn btn-sm btn-outline-primary me-2" (click)="loadTeamMembers()">Team Members</button>
      <button class="btn btn-sm btn-outline-primary me-2" (click)="loadProjectLeads()">Project Leads</button>
      <button class="btn btn-sm btn-outline-primary" (click)="loadProjectAdmins()">Project Admins</button>
    </div>
  </div>

  <div *ngIf="loading()" class="p-3">Loading...</div>
  <div *ngIf="error" class="p-3 text-danger">{{ error }}</div>

  <table *ngIf="!loading() && users().length" class="table mt-3">
    <thead>
      <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Full name</th>
        <th>Roles</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of users()">
        <td>{{ u.username }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.fullName }}</td>
        <td>{{ u.roles.join(', ') }}</td>
        <td class="text-end d-flex">
          <div *ngIf="isSeededAdmin()">
            <button class="btn btn-sm btn-secondary me-2" *ngIf="editingUsername() !== u.username" (click)="startEdit(u)">Edit Role</button>
            <div *ngIf="editingUsername() === u.username" class="d-inline-block me-2">
              <select [value]="newRole()" (change)="newRole.set($any($event.target).value)" class="form-select form-select-sm d-inline-block" style="width:auto;">
                <option *ngFor="let r of availableRoles" [value]="r">{{ r }}</option>
              </select>
              <button class="btn btn-sm btn-primary ms-1" (click)="saveRole(u)">Save</button>
              <button class="btn btn-sm btn-light ms-1" (click)="cancelEdit()">Cancel</button>
            </div>
          </div>
          <button class="btn btn-sm btn-danger" (click)="deleteUser(u.username)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading() && !users().length" class="p-3 text-muted">No users found.</div>
</div>
