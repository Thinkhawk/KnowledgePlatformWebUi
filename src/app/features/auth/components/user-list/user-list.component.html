<div class="page-container mx-auto" style="max-width: 1100px;">
    <div class="mb-3">
        <a class="back-link" (click)="onCancel()">
            <i class="bi bi-arrow-left"></i>
            <span>Back</span>
        </a>
    </div>

    <div class="card-item p-0" style="display: block;">
        
        <div class="p-4 p-md-5 pb-3">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                    <h4 class="fw-bold text-dark mb-1">User Directory</h4>
                    <p class="text-muted small mb-0">Manage platform access for Admins, Leads, and Team Members.</p>
                </div>

                <div class="d-flex">
                    <div class="btn-group shadow-none" style="background: var(--background); padding: 4px; border-radius: var(--radius-sm);">
                        <button type="button" class="btn btn-sm btn-theme-outline border-0 py-2 px-3" (click)="loadTeamMembers()">Members</button>
                        <button type="button" class="btn btn-sm btn-theme-outline border-0 py-2 px-3" (click)="loadProjectLeads()">Leads</button>
                        <button type="button" class="btn btn-sm btn-theme-outline border-0 py-2 px-3" (click)="loadProjectAdmins()">Admins</button>
                    </div>
                    <div class="d-flex align-items-center ms-3 shadow-none" style="background: var(--background); padding: 4px; border-radius: var(--radius-sm);">
                        <a [routerLink]="['/create-user']" class="btn-theme  border-0 py-2 px-3 text-decoration-none" style="border-radius:4px">Create User</a>
                    </div>
                </div>
            </div>
        </div>

        <hr class="m-0">

        <div>
            <div *ngIf="loading()" class="p-5 text-center">
                <div class="spinner-border spinner-border-sm text-primary me-2"></div>
                <span class="text-muted small fw-bold text-uppercase">Fetching Users...</span>
            </div>

            <div *ngIf="error" class="mx-4 mt-4 alert-error">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
            </div>

            <div class="table-responsive" *ngIf="!loading() && users().length">
                <table class="table table-hover align-middle mb-0">
                    <thead style="background: var(--background);">
                        <tr>
                            <th class="ps-5 py-3 small fw-bold text-muted text-uppercase">Username</th>
                            <th class="py-3 small fw-bold text-muted text-uppercase">Email Address</th>
                            <th class="py-3 small fw-bold text-muted text-uppercase">Assigned Roles</th>
                            <th class="pe-5 py-3 text-end small fw-bold text-muted text-uppercase">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let u of users()">
                            <td class="ps-5 py-3">
                                <span class="fw-bold text-dark">{{ u.username }}</span>
                            </td>

                            <td class="py-3 text-secondary small">
                                {{ u.email }}
                            </td>

                            <td class="py-3">
                                <div class="d-flex flex-wrap gap-1">
                                    <span class="badge rounded-pill bg-light text-dark border px-2 py-1 fw-medium x-small" *ngFor="let role of u.roles">
                                        {{ role }}
                                    </span>
                                </div>
                            </td>

                            <td class="pe-5 py-3 text-end">
                                <div class="d-flex justify-content-end align-items-center gap-2">
                                    <ng-container *ngIf="isSeededAdmin()">
                                        <button type="button"
                                                class="btn-sm btn-theme-outline border-0"
                                                *ngIf="editingUsername() !== u.username"
                                                (click)="startEdit(u)">
                                            <i class="bi bi-pencil-square me-1"></i> Edit Role
                                        </button>

                                        <div *ngIf="editingUsername() === u.username" class="d-flex gap-1 align-items-center bg-light p-1 rounded-3 border">
                                            <select #roleSelect
                                                    [value]="newRole()"
                                                    (change)="newRole.set($any($event.target).value)"
                                                    class="form-select form-select-sm border-0 bg-transparent shadow-none"
                                                    style="min-width: 120px;">
                                                <option *ngFor="let r of availableRoles" [value]="r">{{ r }}</option>
                                            </select>
                                            <button type="button" class="btn-sm btn-theme py-1" style="border-radius:4px" (click)="saveRole(u, roleSelect.value)">Save</button>
                                            <button type="button" class="btn btn-sm btn-light py-1 border" (click)="cancelEdit()">
                                                <i class="bi bi-x"></i>
                                            </button>
                                        </div>
                                    </ng-container>

                                    <button type="button"
                                            class="btn-sm btn-theme-danger-outline border-0"
                                            (click)="deleteUser(u.username)">
                                        <i class="bi bi-trash3"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div *ngIf="!loading() && !users().length" class="p-5 text-center">
                <div class="text-muted mb-2"><i class="bi bi-people fs-1 opacity-25"></i></div>
                <p class="text-muted small fw-bold text-uppercase">No users found in this category.</p>
            </div>
        </div>
    </div>
</div>
