<div class="page-container mx-auto" style="max-width: 1100px;">
    <div class="mb-3">
        <a class="back-link" (click)="onCancel()">
            <i class="bi bi-arrow-left"></i>
            <span>Back</span>
        </a>
    </div>
    <div class="form-card w-100 mx-auto mt-4" style="max-width: 1100px;">
        <div class="mb-4">
            <h4 class="fw-bold text-dark mb-1">Create User</h4>
            <p class="text-muted small">Add a new member to the platform and assign their access level.</p>
        </div>

        <hr class="mb-4">

        <div *ngIf="message" class="alert-success mb-4">
            <i class="bi bi-check-circle-fill me-2"></i> {{ message }}
        </div>

        <div *ngIf="error" class="alert-error mb-4">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">Username <span class="required">*</span></label>
                        <input type="text"
                               class="form-control"
                               formControlName="username"
                               placeholder="johndoe">
                        <div class="field-error" *ngIf="form.get('username')?.touched && form.get('username')?.invalid">
                            Username is required.
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">Email Address <span class="required">*</span></label>
                        <input type="email"
                               class="form-control"
                               formControlName="email"
                               placeholder="name@example.com">
                        <div class="field-error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
                            Please enter a valid email.
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">Password <span class="required">*</span></label>
                        <input type="password"
                               class="form-control"
                               formControlName="password">
                        <div class="field-error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
                            Password is required.
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">Access Role <span class="required">*</span></label>
                        <select class="form-select" formControlName="role">
                            <option value="" disabled selected>Select a role...</option>
                            <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
                        </select>
                        <div class="field-error" *ngIf="form.get('role')?.touched && form.get('role')?.invalid">
                            Please assign a role.
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-actions mt-4 d-flex justify-content-end">
                <button type="submit" (click)="onCancel()"
                        class="btn btn-outline-secondary mx-6">
                    Cancel
                </button>
                <button type="submit"
                        class="btn-theme mx-6"
                        [disabled]="loading || form.invalid">
                    <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                    {{ loading ? 'Creating...' : 'Create User' }}
                </button>

            </div>
        </form>
    </div>
</div>
