<div class="login-page">
    <div class="login-container">
        <div class="logo-wrap">
            <img src="assets/images/knowledge-share-logo.png" alt="Knowledge Share Platform" class="login-logo" />
            <span class="login-title">Knowledge Platform</span>
        </div>
        <p class="subtitle">Sign in to your account</p>

        <div *ngIf="error" class="alert alert-danger mb-3">
            {{ error }}
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input id="username"
                       formControlName="username"
                       type="text"
                       class="form-control"
                       [class.is-invalid]="form.get('username')?.touched && form.get('username')?.invalid"
                       [disabled]="loading"
                       autocomplete="username" />
                <div *ngIf="form.get('username')?.touched && form.get('username')?.invalid" class="invalid-feedback d-block">
                    <div *ngIf="form.get('username')?.errors?.['required']">Username is required</div>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input id="password"
                       formControlName="password"
                       type="password"
                       class="form-control"
                       [class.is-invalid]="form.get('password')?.touched && form.get('password')?.invalid"
                       [disabled]="loading"
                       autocomplete="current-password" />
                <div *ngIf="form.get('password')?.touched && form.get('password')?.invalid" class="invalid-feedback d-block">
                    <div *ngIf="form.get('password')?.errors?.['required']">Password is required</div>
                </div>
            </div>

            <button type="submit" class="btn-theme w-100" [disabled]="loading">
                {{ loading ? 'Signing in...' : 'Sign In' }}
            </button>
        </form>

        <div class="mock-hint mt-4">
            <p>Don't have an account or forgot password?</p>
            <p>Contact your <em>administrator</em> to create one.</p>
        </div>
    </div>
</div>
