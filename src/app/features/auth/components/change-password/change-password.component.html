<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-4 p-md-5">

                    <div class="mb-4 text-center">
                        <div class="btn-theme-outline-icon mb-2">
                            <i class="bi bi-shield-lock fs-1"></i>
                        </div>
                        <h4 class="fw-bold text-dark mb-1">Change Password</h4>
                    </div>

                    <div *ngIf="message" class="alert alert-success border-0 small py-2 mb-4">
                        <i class="bi bi-check-circle-fill me-2"></i> {{ message }}
                    </div>

                    <div *ngIf="error" class="alert alert-danger border-0 small py-2 mb-4">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
                    </div>

                    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted text-uppercase">Current Password</label>
                            <input type="password"
                                   class="form-control form-control-lg border-light-subtle bg-light-subtle shadow-none"
                                   formControlName="currentPassword">

                            <div class="text-danger x-small mt-1"
                                 *ngIf="form.controls['currentPassword'].touched && form.controls['currentPassword'].invalid">
                                Current password is required.
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase">New Password</label>
                            <input type="password"
                                   class="form-control form-control-lg border-light-subtle bg-light-subtle shadow-none"
                                   formControlName="newPassword">

                            <div class="text-danger x-small mt-1"
                                 *ngIf="form.controls['newPassword'].touched && form.controls['newPassword'].invalid">
                                New password is required (minimum 6 characters).
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit"
                                    class="btn-theme py-2 fw-bold shadow-sm"
                                    [disabled]="loading || form.invalid">
                                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                                Update Password
                            </button>

                            <a (click)="onCancel()" class="btn btn-link btn-sm text-muted text-decoration-none">
                                Cancel
                            </a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
