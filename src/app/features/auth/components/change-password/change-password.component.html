<div class="page-container mx-auto">

    <div class="form-card mx-auto">
        <div class="mb-4 text-center">
            <div class="btn-theme-outline-icon mb-2">
                <i class="bi bi-shield-lock fs-1"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Change Password</h4>
            <p class="text-muted small">Update your credentials to keep your account secure.</p>
        </div>

        <hr class="mb-4">

        <div *ngIf="message" class="alert-success mb-4">
            <i class="bi bi-check-circle-fill me-2"></i> {{ message }}
        </div>

        <div *ngIf="error" class="alert-error mb-4">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>

            <div class="form-group">
                <label class="form-label">Current Password <span class="required">*</span></label>
                <input type="password"
                       class="form-control"
                       formControlName="currentPassword"
                       placeholder="Enter current password">

                <div class="field-error" *ngIf="form.controls['currentPassword'].touched && form.controls['currentPassword'].invalid">
                    Current password is required.
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">New Password <span class="required">*</span></label>
                <input type="password"
                       class="form-control"
                       formControlName="newPassword"
                       placeholder="Enter new password">

                <div class="field-error" *ngIf="form.controls['newPassword'].touched && form.controls['newPassword'].invalid">
                    New password is required (minimum 6 characters).
                </div>
            </div>

            <div class="form-actions mt-4 d-flex flex-column">
                <button type="submit"
                        class="btn-theme w-100"
                        [disabled]="loading || form.invalid">
                    <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                    {{ loading ? 'Updating...' : 'Update Password' }}
                </button>
                <a (click)="onCancel()" class="back-link mx-auto">
                    Cancel
                </a>
            </div>

        </form>
    </div>
</div>
