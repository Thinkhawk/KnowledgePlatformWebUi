<div class="change-password">
  <h2>Change Password</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <label>Current password</label>
      <input type="password" formControlName="currentPassword" />
      <div *ngIf="form.controls['currentPassword'].touched && form.controls['currentPassword'].invalid" class="error">Current password is required</div>
    </div>

    <div>
      <label>New password</label>
      <input type="password" formControlName="newPassword" />
      <div *ngIf="form.controls['newPassword'].touched && form.controls['newPassword'].invalid" class="error">New password is required (min 6 chars)</div>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="loading">Change password</button>
    </div>

    <div *ngIf="message" class="message">{{ message }}</div>
    <div *ngIf="error" class="error">{{ error }}</div>
  </form>
</div>
